name: Ingest Course Review Issue

on:
  issues:
    types: [opened, edited, labeled]

# Serialize only per issue (so opened/edited/labeled for the same issue don't race);
# different issues run in parallel and resolve push races via the retry loop below.
concurrency:
  group: course-review-ingest-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'course-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Ingest and push to batch branch
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv sync --no-dev
          for attempt in 1 2 3 4 5; do
            # Always rebuild on top of the latest batch branch so accumulated
            # reviews (and the regenerated index) include everyone else's work.
            git fetch origin batch/course-review || true
            if git show-ref --verify --quiet refs/remotes/origin/batch/course-review; then
              git checkout -B batch/course-review origin/batch/course-review
            else
              git checkout -B batch/course-review
            fi

            uv run python github-action/ingest_issue.py

            git add docs/courses
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "chore: ingest review from issue #${ISSUE_NUMBER}"

            if git push origin HEAD:batch/course-review; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); another run got there first, re-syncing."
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '自动生成失败，请检查填写信息与课程数据是否匹配。'
            })

      - name: Comment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '已生成课程评价并提交到批次分支 batch/course-review，请合并后手动触发 workflow_dispatch 部署。'
            })

      - name: Close issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
